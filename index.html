<style>
:root{--bg:#0b0a1f;--panel:#16143a;--panel2:#1d1a4a;--line:#2f2a6b;--ink:#f1efff;--ink-soft:#b9b3e6;--paper:#0f0d2b;--gold:#ffc83d;--green:#3ddc97;--red:#ff5a6e;--cyan:#22e4ff;--f-body:system-ui,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:light){:root{--bg:#f4f3fb;--panel:#fff;--panel2:#f7f6ff;--line:#d9d5f2;--ink:#1d1a3a;--ink-soft:#5d5885;--paper:#fff;--gold:#c98a00;--green:#12965f;--red:#d6334a;--cyan:#0a86b8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}h1{font-size:1.7rem;margin:.2em 0}h2{font-size:1.2rem;margin:.2em 0 .5em}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hint{color:var(--ink-soft);font-size:.9rem;margin:.3em 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:8px 12px;font:600 .95rem var(--f-body);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--cyan)}.btn.gold{background:var(--gold);color:#1d1400;border-color:var(--gold)}.btn.sm{padding:4px 9px;font-size:.85rem}.btn.red{border-color:var(--red);color:var(--red)}
textarea,input,select{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);font:500 .95rem var(--f-body)}
textarea{width:100%;resize:vertical}.field{display:grid;gap:4px;color:var(--ink-soft);font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink-soft);font-weight:600;position:sticky;top:0;background:var(--panel)}tr.sel td{background:var(--panel2)}tbody tr{cursor:pointer}
.tw{overflow:auto;max-height:70vh}.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-weight:700;font-size:.85rem;border:1.5px solid}
.g{color:var(--green);border-color:var(--green)}.y{color:var(--gold);border-color:var(--gold)}.r{color:var(--red);border-color:var(--red)}.n{color:var(--ink-soft);border-color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bar{display:grid;grid-template-columns:1fr 90px 64px;gap:8px;align-items:center;font-size:.88rem;margin:3px 0}.bar i{display:block;height:8px;border-radius:4px;background:var(--line)}.bar i b{display:block;height:100%;border-radius:4px}
ul{margin:.3em 0;padding-left:1.2em}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--green);color:#002414;padding:10px 16px;border-radius:12px;font-weight:700;z-index:99}
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,4,20,.72);padding:16px}.ov .pnl{max-width:640px;width:100%;max-height:88vh;overflow:auto}
.cl-ta{width:100%;margin:8px 0}[hidden]{display:none!important}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:8px}.bcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}.bcol h3{font-size:1rem;margin:0 0 6px}
.bz{border:1.5px dashed var(--line);border-radius:10px;padding:6px;min-height:48px;display:flex;flex-wrap:wrap;gap:6px}.bz.hot,.bseat.hot{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,transparent)}
.bseat{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:10px;padding:2px 6px;margin:3px 0;min-height:48px}
.bc{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:2px 2px 2px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);cursor:grab;touch-action:none;user-select:none;font-size:.9rem;max-width:100%}
.bc small{color:var(--ink-soft)}.bc.sel{outline:3px solid var(--cyan)}.bc.okc{border-color:var(--green)}.bc.rep{border-color:var(--gold)}.bc.rmc{border-color:var(--red)}.bc.noc{border-style:dashed;color:var(--ink-soft);cursor:default;touch-action:auto;padding-right:10px}.bc.tch{border-color:#8f7bff}
.bc:focus-visible,.bz:focus-visible,.bseat:focus-visible{outline:3px solid var(--cyan)}.bm{min-width:40px;min-height:40px;border:0;background:none;color:var(--ink-soft);cursor:pointer;font-size:1.1rem;border-radius:50%}
.bmenu{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;width:100%}.bmenu button{min-height:44px;text-align:left;background:none;border:0;color:var(--ink);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}
.bmenu button:hover,.bmenu button:focus{background:var(--panel2)}.bghost{position:fixed;pointer-events:none;z-index:200;opacity:.9}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.poster-ov{background:rgba(5,4,20,.85)}.poster{background:#fff;color:#111;border-radius:16px;padding:24px 28px;max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center;font:500 1.05rem/1.5 var(--f-body)}
.poster h1{font-size:2rem;margin:.1em 0}.poster .ps{color:#444;margin:.2em 0}.poster img{width:min(78vw,360px);height:auto;image-rendering:pixelated;margin:10px auto;display:block}.poster ol{text-align:left;max-width:460px;margin:10px auto}
@media print{body>*:not(.poster-ov){display:none!important}.poster-ov{position:static;display:block;background:#fff;padding:0}.poster{max-height:none;box-shadow:none}.noprint{display:none!important}}@media (max-width:700px){.hide-s{display:none}}
</style>

"use strict";
/* Teacher panel: reports arrive as links (#r=…) or pasted messages; everything is stored only in this browser.
   Stored under g7-teacher: the games share this web address, and the Türkçe game's backup/clear touches every "t7-" key,
   so the panel's old key "t7-class" is moved once. */
/* ===================== screen language: Türkçe | English =====================
   Only what is drawn on screen is translated (text nodes, placeholders, titles, labels, confirm/prompt/toast).
   Everything that leaves the panel (share texts, links, parent messages, CSV content) is built in Turkish elsewhere and
   is never passed through this translator; share text areas, the QR poster and [lang=tr] areas are skipped.
   The choice is per device (g7-panel-lang), not in the panel data or the backup. */
let UI=(()=>{try{return localStorage.getItem('g7-panel-lang')==='en'?'en':'tr'}catch(e){return 'tr'}})();
const SUBJ_EN={'Matematik':'Maths','Fen Bilimleri':'Science','Peygamberimizin Hayatı':'Life of the Prophet','İngilizce':'English','Sosyal Bilgiler':'Social Studies','Türkçe':'Turkish',
  'Matematik 7':'Maths 7','Fen Bilimleri 7':'Science 7','Peygamberimizin Hayatı 7':'Life of the Prophet 7','English 7':'English 7','Sosyal Bilgiler 7':'Social Studies 7','Türkçe 7':'Turkish 7'};
const EN_EXACT={"Sınıf kodu":"Class code","Açıklama (isteğe bağlı)":"Description (optional)","Sınıf kodu: sınıf (1–12) ve en çok 3 harf ya da rakam, örnek 7-A, 7-AB, 10-FEN, 8-101. Kodu değiştirirseniz öğrenciler sınıf bağlantısıyla yeni kodu onaylar.":"Class code: grade (1–12) and up to 3 letters or digits, for example 7-A, 7-AB, 10-FEN, 8-101. If you change the code, students confirm the new code through the class link.","Sınıf kodunu 7-A, 7-AB, 10-FEN ya da 8-101 gibi yazın.":"Write the class code like 7-A, 7-AB, 10-FEN or 8-101.","Bu kodla başka bir sınıf var.":"Another class already has this code.","Sınıfları 7-A, 7-AB, 10-FEN gibi yazın.":"Write classes like 7-A, 7-AB, 10-FEN.","örnek: Sabahçı şube":"example: Morning section","Geçersiz kod":"Invalid code","(sınıf öğretmeni boş bırakabilir)": "(a class teacher may leave this empty)", "7 günden uzun süredir rapor göndermeyenler": "No report for more than 7 days", "7. sınıf oyunları: Matematik, Fen Bilimleri, Peygamberimizin Hayatı, İngilizce, Sosyal Bilgiler, Türkçe. Öğrenciler oyunda \"Öğretmenime gönder\"e basar; gelen bağlantıyı açtığınızda ya da mesajları aşağıya yapıştırdığınızda rapor buraya eklenir.": "Grade 7 games: Maths, Science, Life of the Prophet, English, Social Studies, Turkish. Students press \"Öğretmenime gönder\" (send to my teacher) in the game; when you open the link you receive, or paste the messages below, the report is added here.", "Adınız soyadınız": "Your first name and surname", "Annenin telefonu": "Mother's phone", "Babanın telefonu": "Father's phone", "Bağlantı hangi oyunda açılsın?": "Which game should the link open?", "Bir ders yuvasına sürükleyin.": "Drag onto a subject seat.", "Boş": "Empty", "boş": "empty", "— boş —": "— empty —", "Bu oyundan henüz rapor yok.": "No report from this game yet.", "Buraya bırakılan öğrenci sınıfından çıkarılır.": "A student dropped here is removed from their class.", "Bütün sınıf": "Whole class", "Bütün veriler yalnızca bu cihazdaki bu tarayıcıda saklanır; hiçbir sunucuya gönderilmez. Cihaz değiştirmeden önce yedek alın. Okul ve KVKK kuralları gereği, artık gerekmeyen öğrenci kayıtlarını silin.": "All data is stored only in this browser on this device and never sent to a server. Take a backup before changing device. Under school and KVKK rules, delete student records you no longer need.", "Davet": "Invited", "Daveti hazırla": "Prepare the invitation", "Daveti öğretmene WhatsApp, BiP ya da e-posta ile gönderin.": "Send the invitation to the teacher by WhatsApp, BiP or e-mail.", "Ders": "Subject", "Ders (oyun)": "Subject (game)", "Ders öğretmeni": "Subject teacher", "Ders(ler)iniz": "Your subject(s)", "Dersi": "Subject", "Dil ve anlatım (kelime, cümle)": "Language and expression (words, sentences)", "Durum": "Status", "Duyuru imzalanır; yalnızca sınıfın koordinatöründen ya da sınıfta görevli öğretmenden geldiğinde öğrencinin ana sayfasında görünür. 30 gün sonra kendiliğinden kalkar.": "The announcement is signed; it shows on the student's home screen only when it comes from the class coordinator or a teacher seated in the class. It disappears after 30 days.", "Duyuruyu hazırla": "Prepare the announcement", "Düzen (giriş–gelişme–sonuç)": "Structure (introduction, development, conclusion)", "E-postanız (isteğe bağlı)": "Your e-mail (optional)", "E-postası (isteğe bağlı)": "E-mail (optional)", "Ek not (isteğe bağlı)": "Extra note (optional)", "Gelen bağlantıya dokunmak da raporu doğrudan ekler.": "Tapping a link you receive also adds the report directly.", "Geliştirilmeli": "Needs work", "İyi": "Good", "Çok iyi": "Very good", "Mükemmel": "Excellent", "Geri al": "Undo", "Geri bildirimi gönder": "Send feedback", "Gönder": "Send", "Göndermeden önce metni değiştirebilirsiniz.": "You can edit the text before sending.", "Görevler": "Tasks", "Her ders için sınıfın öğretmenini seçin. Değişiklikten sonra \"Sınıf bağlantısı\"nı sınıfa yeniden gönderin; öğrenciler eski → yeni öğretmeni görüp onaylar.": "Choose the class teacher for each subject. After a change, send the class link to the class again; students see old → new teacher and confirm.", "Her satıra bir öğrenci (Ad Soyad). e-Okul'dan kopyalanan listedeki sıra ve okul numaraları kendiliğinden atılır. Liste yalnızca bu cihazda saklanır.": "One student per line (first name and surname). Row and school numbers copied from e-Okul are removed automatically. The list is kept only on this device.", "Kaydet": "Save", "Kaydet'e basana kadar hiçbir numara kaydedilmez.": "No number is saved until you press Save.", "Kendi aldığınız raporlar ve ders öğretmenlerinin özetleri birlikte. Uyarısı olan öğrenciler üstte. Sınıf seçimi \"Sınıf listesi\"ndeki seçimle aynıdır.": "Your own reports and the subject teachers' summaries together. Students with warnings are at the top. The class filter is the one in \"Class list\".", "Kime?": "To whom?", "Mesajı hazırla": "Prepare the message", "Rapor geçmişi": "Report history", "Raporları ekle": "Add reports", "Rolünüz": "Your role", "Seçili öğrenciler": "Selected students", "Sil": "Delete", "Son": "Last", "Son 7 gün": "Last 7 days", "Son gün": "Due date", "Son rapor": "Last report", "Son özet": "Last summary", "Sürükleyip bırakın; dokunmatik ekranda önce kişiye sonra yere dokunun ya da ⋯ ile taşıyın. Esc vazgeçer.": "Drag and drop; on a touch screen tap the person, then the place, or use ⋯ to move. Esc cancels.", "Sık hatalar": "Common mistakes", "Sınıf": "Class", "Sınıf öğretmeni ders öğretmenlerini davet eder, onların özetlerini alır ve bütün dersleri birlikte görür. Ders öğretmeni kendi dersini ve sınıflarını yönetir.": "The class teacher invites subject teachers, receives their summaries and sees all subjects together. A subject teacher manages their own subject and classes.", "Sınıf öğretmeni · koordinatör": "Class teacher · coordinator", "Sınıflar": "Classes", "Sınıfları (virgülle)": "Classes (comma separated)", "Sınıflarınız (virgülle ayırın)": "Your classes (comma separated)", "Sınıfta en sık hatala function trx(t){if(UI!=='en'||t==null)return t;const s=String(t),k=s.trim();if(!k)return s;let r=SUBJ_EN[k]!==undefined?SUBJ_EN[k]:EN_EXACT[k];

  return r===undefined?s:s.replace(k,r)}
const NOTR='.cl-ta,.poster,[lang=tr],textarea,input,select option[data-raw]';
function translateTree(root){if(UI!=='en'||!root)return;const skip=el=>!el||el.closest(NOTR);
  if(root.nodeType===3){if(!skip(root.parentElement)){const v=trx(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v}return}
  if(root.nodeType!==1||skip(root))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{if(!skip(n.parentElement)){const v=trx(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}});
  [root,...root.querySelectorAll('[placeholder],[title],[aria-label]')].forEach(el=>{if(!el.getAttribute||el.closest(NOTR)&&el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA')return;
    ['placeholder','title','aria-label'].forEach(a=>{const v=el.getAttribute(a);if(v){const t=trx(v);if(t!==v)el.setAttribute(a,t)}})})}
new MutationObserver(ms=>{if(UI!=='en')return;ms.forEach(m=>m.addedNodes.forEach(translateTree))}).observe(document.documentElement,{childList:true,subtree:true});

function addReport(code){const o=CL.unpack(code);if(!o||!o.st||!o.g)return null;const d=DB(),k=CL.key(o.st);
  if(o.st.sid){const ok=Object.keys(d.students).find(x=>x!==k&&d.students[x].st&&d.students[x].st.sid===o.st.sid);
    if(ok){const a=d.students[ok],n=d.students[k]||{st:o.st,contact:{},reports:[],notes:[]};
      const R=[...(a.reports||[]),...(n.reports||[])].filter((r,i,A)=>A.findIndex(q=>q.t===r.t)===i).sort((x,y)=>x.t-y.t).slice(-15);
      const c=pc(n).father||pc(n).mother||pc(n).email?n.contact:a.contact;
      d.students[k]={...a,...n,st:o.st,reports:R,notes:[...(a.notes||[]),...(n.notes||[])].slice(-40),contact:c||{},reviews:{...(a.reviews||{}),...(n.reviews||{})},
        contactSuggest:[a.contactSuggest,n.contactSuggest].filter(Boolean).sort((x,y)=>y.t-x.t)[0]};if(!d.students[k].contactSuggest)delete d.students[k].contactSuggest;
      delete d.students[ok];(d.outbox||[]).forEach(it=>{if(it.key===ok)it.key=k});if(sel===ok)sel=k}}
  const s=d.students[k]||(d.students[k]={st:o.st,contact:{},reports:[],notes:[]});s.st=o.st;
  /* parent contact sent with the parent's permission: kept as a suggestion the teacher accepts, never written straight in */
  if(o.vc&&typeof o.vc==='object'){const f={};['father','mother'].forEach(x=>{const v=String(o.vc[x]||'').trim();if(v&&CL.okPhone(v))f[x]=v});const e=String(o.vc.email||'').trim();if(e&&CL.okMail(e))f.email=e;
    if(Object.keys(f).length&&(!s.contactSuggest||s.contactSuggest.t<o.t))s.contactSuggest={...f,t:o.t}}
  if(!s.reports.some(r=>r.t===o.t)){s.reports.push({t:o.t,g:o.g,...(Array.isArray(o.od)?{od:o.od}:{}),...(Array.isArray(o.cl)?{cl:o.cl}:{})});s.reports.sort((a,b)=>a.t-b.t);s.reports=s.reports.slice(-15)}SAVE(d);return o}

    ${(()=>{const W=GK.flatMap(g=>((r&&r.g[g]&&r.g[g].writes)||[]).map(w=>[g,...w]));return W.length?`<p style="margin:.8em 0 .2em"><b>📝 Yazıları</b></p>${W.map(([g,no,ti,tx,t],i)=>{const rv=(s.reviews||{})[wkey(g,no,t)],asg=DB().odev.some(a=>a.g===g&&CL.odevMine(a,s.st)&&a.it.some(x=>x[0]==='w'&&x[1]===String(no).replace('.','-')));
      return `<div class="card" style="margin:6px 0"><div class="row" style="justify-content:space-between"><span><b>${H(CL.GAMES[g].tr)} ${H(no)} · ${H(ti)}</b> <span class="hint">${CL.date(t)} · ${String(tx).trim().split(/\s+/).filter(Boolean).length} kelime</span>${asg?' <span class="pill y">📋 Ödev</span>':''}</span>

        <p style="white-space:pre-wrap;margin:.4em 0 0">${H(tx)}</p></div>`}).join('')}`:''})()}

function overview(list){const per=GK.map(g=>{const xs=list.map(s=>latest(s)).filter(r=>r&&r.g[g]&&r.g[g].n).map(r=>r.g[g]);if(!xs.length)return '';

/* parent contact on the teacher's side: father, mother, e-mail (an earlier single phone counts as the father's) */

/* a teacher note travels as a #not=… link and appears on the student's home screen in every game */

const OSX={...CL.ODS,nr:['❔','Rapor gelmedi','n']},ORD=['ok','late','go','new','miss','nr'];
function findOd(s,id){for(let i=s.reports.length-1;i>=0;i--){const r=s.reports[i],e=(r.od||[]).find(x=>x.id===id);if(e)return {...e,rt:r.t}}return null}

const itemHead=it=>`${it[0]==='w'?'📝':'▶'} ${H(String(it[1]).replace('-','.'))}`;
function odevSection(d){const A=d.odev.slice().sort((a,b)=>b.t-a.t),show=allOd?A:A.slice(0,6);

  ${A.length?show.map(a=>{const T=targets(a),cnt={};T.forEach(x=>cnt[x.st]=(cnt[x.st]||0)+1);

/* ===================== class board (coordinator) =====================
   Columns: pool, teachers, one per class (subject seats + students). Moves are recorded at once as outbox items
   d.outbox [{id,kind:'enrol'|'bye'|'move'|'seat',cid,from,key,t,prev,sent}]; status colours still come from reports, with
   unconfirmed outbox items shown on top, so the board never claims an enrolment no report has confirmed.
   d.ptLast: ordering counter for personal enrol / removal links (kept in the backup). */
function nextPt(){const d=DB(),now=Date.now();if(d.ptLast&&now<d.ptLast-60000)toast('Cihaz saati geride görünüyor; lütfen saati kontrol edin.');const pt=Math.max(now,(d.ptLast||0)+1);d.ptLast=pt;SAVE(d);return pt}

function boardModel(d){const ids=Object.keys(d.classes),M={},pool=[];ids.forEach(c=>M[c]=[]);const items=d.outbox||[];
  Object.entries(d.students).forEach(([k,s])=>{const r=latest(s),inCl=new Set(((r&&r.cl)||[]).map(x=>x[0]).filter(c=>ids.includes(c))),st={};inCl.forEach(c=>st[c]='ok');
    items.filter(it=>it.key===k&&!(r&&r.t>it.t&&confirmedBy(it,inCl))).sort((a,b)=>a.t-b.t).forEach(it=>{
      if(it.kind==='enrol')st[it.cid]='add';else if(it.kind==='bye'){if(st[it.cid])st[it.cid]='rm'}else if(it.kind==='move'){if(st[it.from])st[it.from]='mv';st[it.cid]='add'}});
    let active=false;for(const c in st)if(M[c]){M[c].push({k,s,state:st[c]});if(st[c]!=='rm'&&st[c]!=='mv')active=true}

function bchip(kind,id,label,from,cls,extra){return `<span class="bc ${cls}" tabindex="0" role="button" data-kind="${kind}" data-id="${H(id)}" data-from="${H(from)}" aria-label="${H(label)}">${H(label)}${extra||''}<button class="bm" type="button" aria-label="Taşı…" title="Taşı…">⋯</button></span>`}

    if(from==='pool')obAdd({kind:'enrol',cid:to,key:k,t:pt});else if(to==='pool')obAdd({kind:'bye',cid:from,key:k,t:pt});else obAdd({kind:'move',from,cid:to,key:k,t:pt});return true}
  if((drag.kind==='tc'||drag.kind==='seat')&&z.zone==='seat'){const [,fc,fg]=drag.kind==='seat'?drag.from.split(':'):[];
    return seatChange(z.cid,S=>{if(drag.kind==='seat'&&fc===z.cid&&fg!==z.g)delete S[fg];S[z.g]=drag.id})}
  if(drag.kind==='seat'&&z.zone==='team'){const [,fc,fg]=drag.from.split(':');return seatChange(fc,S=>{delete S[fg]})}
  return false}
function obUndo(id){const d=DB(),it=(d.outbox||[]).find(x=>x.id===id);if(!it)return;
  if(!it.sent){if(it.kind==='seat'&&it.prev){const x=d.classes[it.cid];x.seats=it.prev;x.v=(x.v||1)+1;x.t=Date.now()}d.outbox=d.outbox.filter(x=>x.id!==id);SAVE(d);render();bLive('Geri alındı.');return}
  if(it.kind==='seat'){const d2=DB(),x=d2.classes[it.cid],cur={...x.seats};x.seats=it.prev||{};x.v=(x.v||1)+1;x.t=Date.now();SAVE(d2);obAdd({kind:'seat',cid:it.cid,t:Date.now(),prev:cur})}
  else{const pt=nextPt();if(it.kind==='enrol')obAdd({kind:'bye',cid:it.cid,key:it.key,t:pt});else if(it.kind==='bye')obAdd({kind:'enrol',cid:it.cid,key:it.key,t:pt});else obAdd({kind:'move',from:it.cid,cid:it.from,key:it.key,t:pt})}
  render();bLive('Geri almak için yeni bir bağlantı eklendi.')}
async function byeObj(cid,key,pt){const d=DB(),m=d.me,x=d.classes[cid],k=await myKey();const o={k:'bye',cid,c:x.c,co:{tid:m.tid,n:m.n,pub:k.pub},bye:{key,pt}};o.sig=await CL.signObj(k.priv,o);return o}
async function obSend(id){const d=DB(),it=(d.outbox||[]).find(x=>x.id===id);if(!it)return;const s=d.students[it.key],cc=x=>d.classes[x]?d.classes[x].c:'?';
  const mark=()=>{const d2=DB(),j=(d2.outbox||[]).find(x=>x.id===id);if(j&&!j.sent){j.sent=Date.now();SAVE(d2);setTimeout(render,0)}};
  try{if(it.kind==='seat'){await shareClass(it.cid,null,mark);return}
    let en='',by='';
    if(it.kind!=='bye'){const o=await classObj(it.cid,{to:{key:it.key,pt:it.t},...(it.kind==='move'?{from:{cid:it.from}}:{})});en=classUrl(o)}
    if(it.kind!=='enrol'){by=CL.GAMES.m7.url+'#sinif='+CL.pack(await byeObj(it.kind==='bye'?it.cid:it.from,it.key,it.t))}
    const n=s?s.st.n:'';const L=it.kind==='enrol'?[`Merhaba ${n}, ${cc(it.cid)} sınıfına katılmak için bu bağlantıya dokun:`,en]
      :it.kind==='bye'?[`Merhaba ${n}, ${cc(it.cid)} sınıfından ayrıldın. Oyunlardaki ilerlemen korunur. Bilgi için dokun:`,by]
      :[`Merhaba ${n}, ${cc(it.from)} sınıfından ${cc(it.cid)} sınıfına geçiyorsun. Sırayla iki bağlantıya dokun:`,`1) ${cc(it.from)} sınıfından çıkış:`,by,`2) ${cc(it.cid)} sınıfına katılım:`,en];
    CL.share({title:obLabel(d,it),intro:'Öğrenciye ya da velisine gönderin. Bağlantı yalnızca bu öğrencinin oyununda çalışır.',rows:9,text:[...L,'',`— ${d.me.n}`].join('\n'),phones:s?CL.phones(pc(s)):[],email:s?pc(s).email:'',subject:'Sınıf bilgisi',onSend:mark})
  }catch(e){toast('Bu tarayıcı imza atamıyor. Paneli internet adresinden Chrome ya da Edge ile açın.')}}
const csvCell=v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return `"${v.replace(/"/g,'""')}"`};
function classCsv(cid){const d=DB(),x=d.classes[cid],L=boardModel(d).M[cid]||[],names=new Set(L.map(o=>nm(CL.full(o.s.st))));const ST={ok:'Kayıtlı',add:'Eklendi, rapor bekleniyor',rm:'Çıkarma bekliyor',mv:'Taşınıyor'};
  const rows=[['Ad','Soyad','Sınıf','Durum','Son rapor'],...L.map(o=>{const r=latest(o.s);return [o.s.st.n,o.s.st.s,x.c,ST[o.state],r?CL.date(r.t):'']}),
    ...(d.roster[x.c]||[]).filter(n=>!names.has(nm(n))).map(n=>{const p=n.split(' '),sn=p.pop();return [p.join(' '),sn,x.c,'Listede, katılmadı','']})];
  const text='﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');window._lastCsv=text;dl(`kayitlilar-${x.c}.csv`,text,'text/csv')}
let pick=null;
function bLive(t){const e=document.getElementById('blive');if(e)e.textContent=t}
function zoneOf(el){const z=el&&el.closest&&el.closest('[data-zone]');return z?{zone:z.dataset.zone,cid:z.dataset.cid,g:z.dataset.g,el:z}:null}
function doMove(drag,z){pick=null;const ok=boardMove(drag,z);render();bLive(ok?'Taşındı. Gönderilecekler listesine eklendi.':'Değişiklik yok.')}
function togglePick(drag){const same=pick&&pick.id===drag.id&&pick.from===drag.from;pick=same?null:drag;
  document.querySelectorAll('#clsec .bc').forEach(x=>x.classList.toggle('sel',!!pick&&x.dataset.id===pick.id&&x.dataset.from===pick.from));bLive(pick?`${drag.label} seçildi. Gideceği yeri seçin; Esc vazgeçer.`:'Seçim kaldırıldı.')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.bmenu').forEach(x=>x.remove());if(pick){pick=null;document.querySelectorAll('#clsec .bc.sel').forEach(x=>x.classList.remove('sel'));bLive('Vazgeçildi.')}}});
function moveMenu(drag,btn){document.querySelectorAll('.bmenu').forEach(x=>x.remove());const d=DB(),C=Object.entries(d.classes);
  const opts=drag.kind==='st'?[...(drag.from!=='pool'?[['pool',null,null,'🧺 Sınıfsızlar (sınıftan çıkar)']]:[]),...C.filter(([k])=>k!==drag.from).map(([k,x])=>['cls',k,null,'🏫 '+x.c])]
    :[...C.flatMap(([k,x])=>GK.map(g=>['seat',k,g,`${x.c} · ${CL.GAMES[g].tr}`])),...(drag.kind==='seat'?[['team',null,null,'Dersten çıkar']]:[])];
  const m=document.createElement('div');m.className='bmenu';m.setAttribute('role','menu');m.innerHTML=opts.map((o,i)=>`<button type="button" role="menuitem" data-i="${i}">${H(o[3])}</button>`).join('');
  btn.closest('.bc').after(m);m.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();const o=opts[+b.dataset.i];m.remove();doMove(drag,{zone:o[0],cid:o[1],g:o[2]})});const f=m.querySelector('button');if(f)f.focus()}
function wireBoard(){const sec=document.getElementById('clsec');if(!sec||!sec.querySelector('.board'))return;
  sec.querySelectorAll('.bc[data-kind]').forEach(c=>{const drag={kind:c.dataset.kind,id:c.dataset.id,from:c.dataset.from,label:c.getAttribute('aria-label')};
    c.addEventListener('pointerdown',e=>{if(e.target.closest('.bm'))return;e.preventDefault();const sx=e.clientX,sy=e.clientY;let g=null,last=null;
      const mv=ev=>{if(!g&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>6){g=c.cloneNode(true);g.classList.add('bghost');document.body.appendChild(g)}
        if(g){g.style.left=ev.clientX+8+'px';g.style.top=ev.clientY+8+'px';const z=zoneOf(document.elementFromPoint(ev.clientX,ev.clientY)),el=z&&z.el;if(last!==el){if(last)last.classList.remove('hot');if(el)el.classList.add('hot');last=el}}};
      const up=ev=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);if(g){g.remove();if(last)last.classList.remove('hot');doMove(drag,zoneOf(document.elementFromPoint(ev.clientX,ev.clientY)))}else togglePick(drag)};
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up)});
    c.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===c){e.preventDefault();togglePick(drag)}});
    const mb=c.querySelector('.bm');if(mb){mb.addEventListener('pointerdown',e=>e.stopPropagation());mb.onclick=e=>{e.stopPropagation();moveMenu(drag,mb)}}});
  sec.querySelectorAll('[data-zone]').forEach(z=>{z.tabIndex=0;z.addEventListener('click',e=>{if(pick&&!e.target.closest('.bc[data-kind]')&&!e.target.closest('.bmenu'))doMove(pick,zoneOf(z))});
    z.addEventListener('keydown',e=>{if(pick&&e.key==='Enter'&&e.target===z)doMove(pick,zoneOf(z))})});
  sec.querySelectorAll('#obox [data-ob]').forEach(li=>{const id=li.dataset.ob,s=li.querySelector('.obs');if(s)s.onclick=()=>obSend(id);li.querySelector('.obu').onclick=()=>obUndo(id)})}

function wireRoles(){const $=id=>document.getElementById(id);document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  if($('prof'))$('prof').onclick=()=>profileDlg(!DB().me);if($('tinv'))$('tinv').onclick=teacherDlg;if($('sum'))$('sum').onclick=sendSummary;
  document.querySelectorAll('#team tr[data-t]').forEach(tr=>{const k=tr.dataset.t;tr.querySelector('.tre').onclick=()=>shareTeacherInvite(k);tr.querySelector('.tas').onclick=()=>askSummary(k);
    tr.querySelector('.tdel').onclick=()=>{const d=DB();if(confirm(`${d.team[k].n} listeden silinsin mi? (Özetleri de silinir.)`)){delete d.team[k];delete d.sums[k];SAVE(d);render()}}});
  document.querySelectorAll('#clsec .card[data-c]').forEach(cd=>{const c=cd.dataset.c,q=x=>cd.querySelector(x);if(q('.cinv'))q('.cinv').onclick=()=>shareClassInvite(c);if(q('.cqr'))q('.cqr').onclick=()=>poster(c);
    if(q('.cann'))q('.cann').onclick=()=>annDlg(ME().cids[c],c);q('.crs').onclick=()=>rosterDlg(c)});
  document.querySelectorAll('#clsec .card[data-cid],#clsec .bcol[data-cid]').forEach(cd=>{const cid=cd.dataset.cid,x=DB().classes[cid],q=s=>cd.querySelector(s);q('.kseat').onclick=()=>classDlg(cid);q('.kinv').onclick=()=>shareClass(cid);
    q('.kqr').onclick=()=>classPoster(cid);q('.kann').onclick=()=>annDlg(cid,x.c);q('.krs').onclick=()=>rosterDlg(x.c);if(q('.kcsv'))q('.kcsv').onclick=()=>classCsv(cid)});
  wireBoard();
  document.querySelectorAll('#pool .penr').forEach(b=>{const r=b.closest('[data-k]');b.onclick=()=>shareClass(r.dataset.cid,DB().students[r.dataset.k])});
  document.querySelectorAll('#coord tr[data-ck]').forEach(tr=>{tr.querySelector('.cpar').onclick=ev=>{ev.stopPropagation();coordParent(tr.dataset.ck)};
    tr.onclick=()=>{if(DB().students[tr.dataset.ck]){sel=tr.dataset.ck;render();document.getElementById('det').scrollIntoView({behavior:'smooth'})}else toast('Bu öğrencinin verisi öğretmen özetinden geliyor; ayrıntı için öğrenciden size de rapor göndermesini isteyin.')}})}
window.addEventListener('hashchange',fromHash);render();fromHash();if(!DB().me&&!/#ogr=/.test(location.hash))setTimeout(()=>profileDlg(true),300);
</script>
